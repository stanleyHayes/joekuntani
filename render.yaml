# Render Blueprint — Joe Kuntani API only (JK-017 / OPS-DEPLOY-001).
# Frontend (Next.js) deploys on Vercel. Do not add a joe-web service here.
#
# Staging and production must use distinct env groups, MongoDB databases,
# Cloudinary folders, Resend recipients, analytics projects, and secrets.
# Never point staging at production data stores.
# Set secret values in the Render dashboard / env groups (sync: false).

previewsEnabled: true

services:
  - type: web
    name: joe-api
    runtime: go
    plan: starter
    region: oregon
    rootDir: apps/api
    # Both binaries: the migration runner has to ship alongside the API or
    # preDeployCommand has nothing to invoke.
    buildCommand: go build -o joe-api ./cmd/api && go build -o joe-mongochange ./cmd/mongochange
    # Schema changes are applied here, before the new build takes traffic.
    # Without this they were never applied at all: nothing else runs them, and
    # the API does not apply them at boot. Production silently drifted four
    # changes behind its code, and because the content validators are closed
    # (`additionalProperties: false`) every save of a field the database had
    # not been told about was rejected — the whole CMS write path returned 500.
    # A failure here aborts the deploy rather than promoting a build the
    # database cannot serve.
    preDeployCommand: ./joe-mongochange
    startCommand: ./joe-api
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Accra
      # Process listens on $PORT when Render injects it (see cmd/api).
      - key: API_ADDR
        value: ":10000"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      # Must be the HTTPS Vercel web origin (exact match for auth CSRF/origin).
      - key: PUBLIC_WEB_URL
        sync: false
      # Standalone staff-console origin, for invitation links and origin checks.
      - key: PUBLIC_ADMIN_URL
        value: https://admin.joekuntani.com
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: TICKET_TOKEN_HMAC_KEY
        sync: false
      - key: ENQUIRY_IP_HMAC_KEY
        sync: false
      - key: CRM_ATTACHMENT_HMAC_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: AUTH_TRUSTED_PROXY_CIDRS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_API_URL
        value: https://api.resend.com/emails
      - key: INTERNAL_NOTIFICATION_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        sync: false
      - key: MEDIA_MAX_BYTES
        value: "10485760"
      - key: MEDIA_MAX_DIMENSION
        value: "6000"
      # Bunny Stream is optional until VIDEO_PROVIDER=bunny. Secrets are set
      # only in the Render dashboard; the browser receives short-lived TUS
      # authorization, never the API or webhook key.
      - key: VIDEO_PROVIDER
        value: bunny
      - key: BUNNY_STREAM_LIBRARY_ID
        sync: false
      - key: BUNNY_STREAM_API_KEY
        sync: false
      - key: BUNNY_STREAM_WEBHOOK_SECRET
        sync: false
      - key: BUNNY_STREAM_CDN_HOSTNAME
        sync: false
      - key: VIDEO_MAX_BYTES
        value: "2147483648"
      - key: VIDEO_UPLOAD_AUTH_TTL
        value: 1h
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYMENT_PROVIDER_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_RETURN_URL
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: RELEASE_VERSION
        sync: false
      - key: ENQUIRY_TRUSTED_PROXY_CIDRS
        sync: false
      - key: ENQUIRY_RATE_LIMIT
        value: "5"
      - key: ENQUIRY_RATE_WINDOW
        value: 1m
      - key: TICKET_HOLD_DURATION
        value: 10m
      # Payments. Without PAYSTACK_SECRET_KEY the API silently falls back to
      # payments.UnavailableProvider, which takes donations, merch and ticket
      # checkout down together while /health/ready still reports healthy.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_API_BASE_URL
        sync: false
      - key: SUPPORT_CURRENCY
        value: GHS
