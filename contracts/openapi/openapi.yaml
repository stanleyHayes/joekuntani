        bytes: { type: integer, format: int64, minimum: 1, maximum: 2147483648 }
        # "" keeps the frame the provider measured; otherwise "W:H".
        aspect_ratio:
          { type: string, pattern: "^$|^[1-9][0-9]{0,4}:[1-9][0-9]{0,4}$" }
    VideoUpdateInput:
