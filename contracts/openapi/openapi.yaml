          title,
          objective,
          platforms,
          starts_on,
          ends_on,
          status,
          fee,
          expenses,
          results,
          asset_ids,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        enquiry_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        title: { type: string }
        objective: { type: string }
        platforms: { type: array, items: { type: string } }
        starts_on: { type: string, format: date-time }
        ends_on: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CampaignStatus" }
        fee: { $ref: "#/components/schemas/CampaignMoney" }
        expenses: { $ref: "#/components/schemas/CampaignMoney" }
        results:
          {
            type: array,
            items: { $ref: "#/components/schemas/CampaignResult" },
          }
        asset_ids: { type: array, items: { type: string, format: uuid } }
        deleted_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CampaignList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Campaign" } }
    CampaignDeliverableStatus:
      type: string
