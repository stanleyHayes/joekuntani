    CampaignMoney:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: "^(0|[1-9][0-9]{0,14})\\.[0-9]{2}$" }
        currency: { type: string, enum: [GHS, USD, EUR, GBP] }
    CampaignResult:
      type: object
      additionalProperties: false
      required: [label, value]
