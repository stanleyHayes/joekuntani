          }
    ContactSettings:
      type: object
      additionalProperties: false
      required: [public_email, phone, location]
      properties:
        public_email:
          anyOf:
            - { type: string, const: "" }
            - { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 40 }
        location: { type: string, maxLength: 120 }
    SocialLink:
      type: object
      additionalProperties: false
      required: [platform, url]
      properties:
        platform: { type: string, minLength: 1, maxLength: 50 }
        url:
          { type: string, format: uri, pattern: "^https://", maxLength: 2048 }
    BrandSettings:
      type: object
      additionalProperties: false
      required: [name, tagline, logo_asset_id, favicon_asset_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        tagline: { type: string, maxLength: 200 }
        logo_asset_id:
          {
            type: string,
            pattern: "^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
          }
        favicon_asset_id:
          {
            type: string,
            pattern: "^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
          }
    SEOSettings:
      type: object
      additionalProperties: false
      required:
        [
          title_template,
          default_title,
          description,
          canonical_base,
          social_image_asset_id,
        ]
      properties:
        title_template: { type: string, maxLength: 100 }
        default_title: { type: string, maxLength: 70 }
        description: { type: string, maxLength: 180 }
        canonical_base:
          { type: string, maxLength: 2048, pattern: "^$|^https://" }
        social_image_asset_id:
          {
            type: string,
            pattern: "^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$",
          }
    ConsentSettings:
      type: object
      additionalProperties: false
      required: [version, privacy_label, marketing_label, privacy_url]
      properties:
        version: { type: string, minLength: 1, maxLength: 80 }
        privacy_label: { type: string, minLength: 1, maxLength: 500 }
        marketing_label: { type: string, maxLength: 500 }
        privacy_url:
          {
            type: string,
            minLength: 1,
            maxLength: 2048,
            pattern: "^(/[^/]|/$|https://)",
          }
    PublicSettings:
      type: object
      additionalProperties: false
      required: [navigation, footer, ctas, contact, social, brand, seo, consent]
      properties:
        navigation:
          {
            type: array,
            maxItems: 12,
            items: { $ref: "#/components/schemas/SettingsLink" },
          }
        footer:
          {
            type: array,
            maxItems: 12,
            items: { $ref: "#/components/schemas/SettingsLink" },
          }
        ctas:
          {
            type: array,
            maxItems: 20,
            items: { $ref: "#/components/schemas/SettingsCTA" },
          }
        contact: { $ref: "#/components/schemas/ContactSettings" }
        social:
          {
            type: array,
            maxItems: 12,
            items: { $ref: "#/components/schemas/SocialLink" },
          }
        brand: { $ref: "#/components/schemas/BrandSettings" }
        seo: { $ref: "#/components/schemas/SEOSettings" }
        consent: { $ref: "#/components/schemas/ConsentSettings" }
    IntegrationSettings:
      type: object
      additionalProperties: false
      required:
        [email_provider, media_provider, analytics_provider, payment_provider]
      properties:
        email_provider:
          { type: string, maxLength: 50, pattern: "^$|^[a-z][a-z0-9_-]{1,47}$" }
        media_provider:
          { type: string, maxLength: 50, pattern: "^$|^[a-z][a-z0-9_-]{1,47}$" }
        analytics_provider:
          { type: string, maxLength: 50, pattern: "^$|^[a-z][a-z0-9_-]{1,47}$" }
        payment_provider:
          { type: string, maxLength: 50, pattern: "^$|^[a-z][a-z0-9_-]{1,47}$" }
    TeamSettings:
      type: object
      additionalProperties: false
      required: [notification_recipients, business_timezone]
      properties:
        notification_recipients:
          { type: array, maxItems: 20, items: { type: string, format: email } }
        business_timezone: { type: string, minLength: 1, maxLength: 100 }
    SettingsValues:
      type: object
      additionalProperties: false
      required:
        [
          navigation,
          footer,
          ctas,
          contact,
          social,
          brand,
          seo,
          consent,
          integrations,
          team,
        ]
      properties:
        navigation:
          {
            type: array,
            maxItems: 12,
            items: { $ref: "#/components/schemas/SettingsLink" },
          }
        footer:
          {
            type: array,
            maxItems: 12,
            items: { $ref: "#/components/schemas/SettingsLink" },
          }
        ctas:
          {
            type: array,
            maxItems: 20,
            items: { $ref: "#/components/schemas/SettingsCTA" },
          }
        contact: { $ref: "#/components/schemas/ContactSettings" }
        social:
          {
            type: array,
            maxItems: 12,
            items: { $ref: "#/components/schemas/SocialLink" },
          }
        brand: { $ref: "#/components/schemas/BrandSettings" }
        seo: { $ref: "#/components/schemas/SEOSettings" }
        consent: { $ref: "#/components/schemas/ConsentSettings" }
        integrations: { $ref: "#/components/schemas/IntegrationSettings" }
        team: { $ref: "#/components/schemas/TeamSettings" }
    SettingsDocument:
      type: object
      additionalProperties: false
      required: [key, version, draft, content_complete, updated_by, updated_at]
      properties:
        key: { type: string, const: global }
        version: { type: integer, format: int64, minimum: 1 }
        draft: { $ref: "#/components/schemas/SettingsValues" }
        published: { $ref: "#/components/schemas/SettingsValues" }
        content_complete: { type: boolean }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
    SecretStatus:
      type: object
      additionalProperties: false
      required:
        [
          email_configured,
          media_configured,
          analytics_configured,
          payment_configured,
        ]
      properties:
        email_configured: { type: boolean }
        media_configured: { type: boolean }
        analytics_configured: { type: boolean }
        payment_configured: { type: boolean }
    AdminSettings:
      type: object
      additionalProperties: false
      required:
        [
          key,
          version,
          draft,
          content_complete,
          updated_by,
          updated_at,
          secret_status,
          can_manage,
        ]
      properties:
        key: { type: string, const: global }
        version: { type: integer, format: int64, minimum: 0 }
        draft: { $ref: "#/components/schemas/SettingsValues" }
        published: { $ref: "#/components/schemas/SettingsValues" }
        content_complete: { type: boolean }
        updated_by: { type: string }
        updated_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        secret_status: { $ref: "#/components/schemas/SecretStatus" }
        can_manage: { type: boolean }
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      required: [version, values, content_complete]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        values: { $ref: "#/components/schemas/SettingsValues" }
        content_complete: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 1024 }
    LoginResponse:
      type: object
      additionalProperties: false
      required: [mfa_required]
      properties:
        mfa_required: { type: boolean }
    MFAVerificationRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
    MFASetupResponse:
      type: object
      additionalProperties: false
      required: [email, secret, otpauth_uri, issuer, digits, period_seconds]
      properties:
        email: { type: string, format: email }
        secret: { type: string, minLength: 16, maxLength: 128 }
        otpauth_uri: { type: string, format: uri }
        issuer: { type: string }
        digits: { type: integer, const: 6 }
        period_seconds: { type: integer, const: 30 }
    AuthenticatedResponse:
      type: object
      additionalProperties: false
      required: [authenticated]
      properties:
        authenticated: { type: boolean, const: true }
    StaffPrincipal:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          email,
          role,
          mfa_verified,
          mfa_enabled,
          permissions,
          preferences,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [administrator, booking_manager, content_editor, analyst]
        mfa_verified: { type: boolean }
        mfa_enabled: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        preferences: { $ref: "#/components/schemas/StaffPreferences" }
    StaffPreferences:
      type: object
      additionalProperties: false
      required:
        [email_product_updates, email_security_alerts, dense_ui, timezone]
      properties:
        email_product_updates: { type: boolean }
        email_security_alerts: { type: boolean }
        dense_ui: { type: boolean }
        timezone: { type: string, minLength: 1, maxLength: 64 }
    StaffUser:
      type: object
      additionalProperties: false
      required: [id, name, email, role, status, mfa_enabled, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [administrator, booking_manager, content_editor, analyst]
        status: { type: string }
        mfa_enabled: { type: boolean }
        updated_at: { type: string, format: date-time }
    NewsletterSubscriber:
      type: object
      additionalProperties: false
      required:
        [id, email, source, status, consent_version, consent_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        source: { type: string }
        status: { type: string }
        consent_version: { type: string }
        consent_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        unsubscribed_at:
          type: [string, "null"]
          format: date-time
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [live, ready]
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
