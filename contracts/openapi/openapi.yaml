openapi: 3.1.0
info:
  title: Joe Kuntani Platform API
  version: 0.1.0
  description: Versioned contract for the standalone Joe Kuntani platform.
  license:
    name: Proprietary - all rights reserved
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Relative API base; clients configure the environment origin.
security: []
tags:
  - name: Health
    description: Process and dependency health checks for deployment orchestration.
  - name: Authentication
    description: Staff session, MFA, and identity endpoints.
  - name: Newsletter
    description: Public newsletter consent signup and staff subscriber management.
  - name: Settings
    description: Published public configuration and audited staff-managed drafts.
  - name: Media
    description: Audited media drafts, signed provider uploads, metadata and callbacks.
  - name: Content
    description: Approved public content and audited editorial lifecycle controls.
  - name: Video
    description: Provider-isolated direct uploads, processing lifecycle, and public adaptive playback.
  - name: Services
    description: Ordered public services and audited content-editor management.
  - name: Events
    description: Audited staff event and ticket-type lifecycle management.
  - name: Enquiries
    description: Privacy-safe, idempotent public enquiry intake.
  - name: Ticketing
    description: First-party ticket inventory reservation and order lifecycle.
  - name: CRM
    description: Audited booking-manager CRM, enquiry pipeline and privacy operations.
  - name: Governance
    description: Role-filtered CSV exports and searchable administrator audit log.
  - name: Analytics
    description: Privacy-safe conversion tracking and role-authorized dashboards.
  - name: Privacy
    description: Legal holds, enquiry retention jobs, and administrator privacy controls.
  - name: Search
    description: Role-filtered administrator global search across operational records.
  - name: TicketOps
    description: Authorized ticket order operations, refunds, voids, and attendee exports.
  - name: Checkin
    description: Atomic door check-in with hashed bearer verification and live attendance counts.
  - name: TicketAnalytics
    description: Privacy-safe ticket sales, inventory, conversion and attendance dashboards.
paths:
  /api/admin/videos:
    get:
      operationId: listAdminVideos
      summary: List provider-backed video assets
      tags: [Video]
      security: [{ staffSession: [] }]
      responses:
        "200":
          description: Video assets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoAssetList" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/admin/videos/uploads:
    post:
      operationId: createVideoUpload
      summary: Create a video record and short-lived direct TUS upload authorization
      tags: [Video]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoUploadInput" }
      responses:
        "201":
          description: Video and resumable upload authorization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoUploadCreated" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/admin/video-categories:
    get:
      operationId: listVideoCategories
      summary: List reusable video categories
      tags: [Video]
      security: [{ staffSession: [] }]
      responses:
        "200":
          description: Video categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoCategoryList" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createVideoCategory
      summary: Create a reusable video category
      tags: [Video]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoCategoryInput" }
      responses:
        "201":
          description: Video category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoCategory" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/admin/video-categories/{categoryID}:
    parameters:
      - name: categoryID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateVideoCategory
      summary: Update a reusable video category
      tags: [Video]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoCategoryUpdateInput" }
      responses:
        "200":
          description: Video category updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoCategory" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/admin/videos/{videoID}:
    parameters:
      - name: videoID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateVideoMetadata
      summary: Update video metadata with revision protection
      tags: [Video]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoUpdateInput" }
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoAsset" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteVideo
      summary: Delete the provider asset and tombstone its application record
      tags: [Video]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - name: revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Video deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/admin/videos/{videoID}/sync:
    post:
      operationId: synchronizeVideo
      summary: Synchronize application state from the video provider
      tags: [Video]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - name: videoID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Synchronized video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoAsset" }
        "403": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/admin/videos/{videoID}/publication:
    patch:
      operationId: setVideoPublication
      summary: Publish a READY video or remove it from public playback
      tags: [Video]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - name: videoID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoPublicationInput" }
      responses:
        "200":
          description: Updated publication state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoAsset" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/webhooks/videos/bunny:
    post:
      operationId: receiveBunnyVideoWebhook
      summary: Apply a signed idempotent Bunny Stream processing callback
      tags: [Video]
      parameters:
        - name: X-BunnyStream-Signature-Version
          in: header
          required: true
          schema: { type: string, const: v1 }
        - name: X-BunnyStream-Signature-Algorithm
          in: header
          required: true
          schema: { type: string, const: hmac-sha256 }
        - name: X-BunnyStream-Signature
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BunnyVideoWebhook" }
      responses:
        "204": { description: Callback accepted or already applied }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/public/videos:
    get:
      operationId: listPublicVideos
      summary: List published READY public videos
      tags: [Video]
      responses:
        "200":
          description: Public videos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicVideoList" }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/public/videos/{videoID}:
    get:
      operationId: getPublicVideo
      summary: Get one published READY video and safe playback URLs
      tags: [Video]
      parameters:
        - name: videoID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicVideo" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/admin/crm/organizations:
    post:
      operationId: createCRMOrganization
      summary: Create an audited CRM organization
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/CRMOrganizationInput" },
                },
            },
        }
      responses:
        {
          "201":
            {
              description: CRM organization created,
              content:
                {
                  application/json:
                    {
                      schema: { $ref: "#/components/schemas/CRMOrganization" },
                    },
                },
            },
          "403": { $ref: "#/components/responses/Problem" },
          "422": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/organizations/{id}:
    delete:
      operationId: softDeleteCRMOrganization
      summary: Soft-delete an audited CRM organization
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "204": { description: CRM organization soft-deleted },
          "403": { $ref: "#/components/responses/Problem" },
          "404": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/organizations/lookup:
    get:
      operationId: lookupCRMOrganization
      summary: Find an active organization by canonicalized name
      tags: [CRM]
      security: [{ staffSession: [] }]
      parameters:
        - {
            name: name,
            in: query,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 160 },
          }
      responses:
        "200":
          {
            description: Canonical organization match,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CRMOrganization" } },
              },
          }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/admin/crm/contacts:
    post:
      operationId: createCRMContact
      summary: Create an audited CRM contact with normalized lookup fields
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CRMContactInput" } },
            },
        }
      responses:
        {
          "201":
            {
              description: CRM contact created,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CRMContact" } },
                },
            },
          "403": { $ref: "#/components/responses/Problem" },
          "409": { $ref: "#/components/responses/Problem" },
          "422": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/contacts/lookup:
    get:
      operationId: lookupCRMContact
      summary: Find a contact by normalized email or phone
      tags: [CRM]
      security: [{ staffSession: [] }]
      parameters:
        - {
            name: email,
            in: query,
            schema: { type: string, format: email, maxLength: 254 },
          }
        - { name: phone, in: query, schema: { type: string, maxLength: 40 } }
      responses:
        {
          "200":
            {
              description: Matching active contact,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CRMContact" } },
                },
            },
          "403": { $ref: "#/components/responses/Problem" },
          "404": { $ref: "#/components/responses/Problem" },
          "422": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/contacts/{id}:
    delete:
      operationId: softDeleteCRMContact
      summary: Soft-delete an audited CRM contact
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "204": { description: CRM contact soft-deleted },
          "403": { $ref: "#/components/responses/Problem" },
          "404": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/enquiries:
    get:
      operationId: listCRMEnquiries
      summary: List and filter authorized CRM enquiries
      tags: [CRM]
      security: [{ staffSession: [] }]
      parameters:
        - {
            name: stage,
            in: query,
            schema:
              { type: array, items: { $ref: "#/components/schemas/CRMStage" } },
          }
        - { name: owner_id, in: query, schema: { type: string, format: uuid } }
        - {
            name: source,
            in: query,
            schema: { type: array, items: { type: string } },
          }
        - {
            name: service_id,
            in: query,
            schema: { type: string, format: uuid },
          }
        - {
            name: organization_id,
            in: query,
            schema: { type: string, format: uuid },
          }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          {
            description: Authorized CRM enquiries,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CRMEnquiryList" } },
              },
          }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCRMEnquiry
      summary: Link a public enquiry into the audited CRM
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CRMEnquiryInput" } },
            },
        }
      responses:
        "201":
          {
            description: CRM enquiry created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CRMEnquiry" } },
              },
          }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/admin/crm/enquiries/{id}:
    delete:
      operationId: softDeleteCRMEnquiry
      summary: Soft-delete a CRM enquiry while preserving audit history
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            {
              description: Soft-deleted enquiry,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CRMEnquiry" } },
                },
            },
          "403": { $ref: "#/components/responses/Problem" },
          "404": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/enquiries/{id}/stage:
    patch:
      operationId: updateCRMEnquiryStage
      summary: Advance an enquiry through the controlled stage pipeline
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [stage],
                      properties:
                        { stage: { $ref: "#/components/schemas/CRMStage" } },
                    },
                },
            },
        }
      responses:
        {
          "200":
            {
              description: Updated enquiry,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CRMEnquiry" } },
                },
            },
          "409": { $ref: "#/components/responses/Problem" },
          "422": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/enquiries/{id}/owner:
    patch:
      operationId: assignCRMEnquiry
      summary: Assign an enquiry to an authorized owner
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [owner_id],
                      properties: { owner_id: { type: string, format: uuid } },
                    },
                },
            },
        }
      responses:
        {
          "200":
            {
              description: Assigned enquiry,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CRMEnquiry" } },
                },
            },
          "403": { $ref: "#/components/responses/Problem" },
          "422": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/views:
    get:
      operationId: listCRMSavedViews
      summary: List the current staff member's saved enquiry views
      tags: [CRM]
      security: [{ staffSession: [] }]
      responses:
        {
          "200":
            {
              description: Current staff saved views,
              content:
                {
                  application/json:
                    {
                      schema:
                        {
                          type: object,
                          additionalProperties: false,
                          required: [items],
                          properties:
                            {
                              items:
                                {
                                  type: array,
                                  items:
                                    {
                                      $ref: "#/components/schemas/CRMSavedView",
                                    },
                                },
                            },
                        },
                    },
                },
            },
          "403": { $ref: "#/components/responses/Problem" },
        }
    post:
      operationId: createCRMSavedView
      summary: Save the current enquiry filters for the signed-in staff member
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [name, filter],
                      properties:
                        {
                          name: { type: string, minLength: 1, maxLength: 120 },
                          filter: { type: object, additionalProperties: true },
                        },
                    },
                },
            },
        }
      responses:
        {
          "201":
            {
              description: Saved view,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/CRMSavedView" } },
                },
            },
          "422": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/contacts/{id}/export:
    get:
      operationId: exportCRMContactPrivacyData
      summary: Export one contact's personal data with an audit record
      tags: [CRM]
      security: [{ staffSession: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            {
              description: Audited privacy export,
              content: { application/json: { schema: { type: object } } },
            },
          "403": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/contacts/{id}/privacy-delete:
    post:
      operationId: deleteCRMContactPrivacyData
      summary: Anonymize one contact and related CRM personal data
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            {
              description: Anonymization counts,
              content: { application/json: { schema: { type: object } } },
            },
          "403": { $ref: "#/components/responses/Problem" },
        }
  /api/admin/crm/enquiries/{id}/workflow:
    get:
      operationId: getCRMEnquiryWorkflow
      summary: Read internal notes, tasks, immutable stage history and proposal attachments
      tags: [CRM]
      security: [{ staffSession: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        "200":
          {
            description: Private CRM workflow,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CRMWorkflow" } },
              },
          }
        "4XX": { $ref: "#/components/responses/Problem" }
  /api/admin/crm/enquiries/{id}/notes:
    post:
      operationId: addCRMEnquiryNote
      summary: Add an audited internal enquiry note
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CRMNoteInput" } },
            },
        }
      responses:
        "201":
          {
            description: Note created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CRMNote" } },
              },
          }
        "4XX": { $ref: "#/components/responses/Problem" }
  /api/admin/crm/enquiries/{id}/tasks:
    post:
      operationId: addCRMEnquiryTask
      summary: Add an assigned prioritized follow-up task and queue an internal notification
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CRMTaskInput" } },
            },
        }
      responses:
        "201":
          {
            description: Task created,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CRMTask" } },
              },
          }
        "4XX": { $ref: "#/components/responses/Problem" }
  /api/admin/crm/enquiries/{id}/tasks/{taskID}/complete:
    post:
      operationId: completeCRMEnquiryTask
      summary: Complete an open follow-up task exactly once
      tags: [CRM]
      security: [{ staffSession: [], csrfToken: [] }]
      parameters:
        - {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - {
            name: taskID,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          {
            description: Completed task,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CRMTask" } },
              },
          }
        "4XX": { $ref: "#/components/responses/Problem" }
