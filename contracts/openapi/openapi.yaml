components:
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: jk_admin_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    Problem:
      description: Request rejected
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  parameters:
    ContentKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [page, portfolio, video, press, testimonial]
    ContentID:
      name: contentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventID:
      name: eventID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketTypeID:
      name: ticketTypeID
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    CRMOrganizationInput:
      type: object
      additionalProperties: false
      required: [name, website, country_code]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        website: { type: string, pattern: "^$|^https://", maxLength: 2048 }
        country_code: { type: string, pattern: "^$|^[A-Z]{2}$" }
    CRMOrganization:
      allOf:
        - { $ref: "#/components/schemas/CRMOrganizationInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            deleted_at: { type: string, format: date-time }
    CRMContactInput:
      type: object
      additionalProperties: false
      required: [organization_id, name, email, phone, role, country_code]
      properties:
        organization_id:
          {
            type: string,
            pattern: "^$|^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
          }
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 20 }
        role: { type: string, maxLength: 120 }
        country_code: { type: string, pattern: "^$|^[A-Z]{2}$" }
    CRMContact:
      allOf:
        - { $ref: "#/components/schemas/CRMContactInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
            deleted_at: { type: string, format: date-time }
    CRMStage:
      type: string
      enum:
        [
          new,
          reviewing,
          qualified,
          call_scheduled,
          proposal_sent,
          negotiation,
          won,
          lost,
          archived,
        ]
    CRMEnquiryInput:
      type: object
      additionalProperties: false
      required:
        [source_enquiry_id, contact_id, organization_id, owner_id, summary]
      properties:
        source_enquiry_id: { type: string, format: uuid }
        contact_id: { type: string, format: uuid }
        organization_id: { type: string, pattern: "^$|^[0-9a-f-]{36}$" }
        owner_id: { type: string, pattern: "^$|^[0-9a-f-]{36}$" }
        summary: { type: string, maxLength: 2000 }
    CRMEnquiry:
      type: object
      additionalProperties: false
      required:
        [
          id,
          source_enquiry_id,
          reference,
          contact_id,
          organization_id,
          service_id,
          owner_id,
          stage,
          source,
          enquiry_type,
          summary,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        source_enquiry_id: { type: string, format: uuid }
        reference: { type: string, minLength: 1, maxLength: 40 }
        contact_id: { type: string }
        organization_id: { type: string }
        service_id: { type: string, format: uuid }
        owner_id: { type: string }
        stage: { $ref: "#/components/schemas/CRMStage" }
        source: { type: string, minLength: 1, maxLength: 80 }
        enquiry_type: { type: string, minLength: 1, maxLength: 80 }
        summary: { type: string, maxLength: 2000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
    CRMEnquiryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          { type: array, items: { $ref: "#/components/schemas/CRMEnquiry" } }
    CRMSavedView:
      type: object
      additionalProperties: false
      required: [id, owner_id, name, filter]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, pattern: "^[0-9a-f]{24}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        filter: { type: object, additionalProperties: true }
    CRMNoteInput:
      type: object
      additionalProperties: false
      required: [body]
      properties: { body: { type: string, minLength: 1, maxLength: 4000 } }
    CRMNote:
      type: object
      additionalProperties: false
      required: [id, enquiry_id, author_id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        enquiry_id: { type: string, format: uuid }
        author_id: { type: string, pattern: "^[0-9a-f]{24}$" }
        body: { type: string, minLength: 1, maxLength: 4000 }
        created_at: { type: string, format: date-time }
    CRMTaskInput:
      type: object
      additionalProperties: false
      required: [title, assignee_id, priority, due_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        assignee_id: { type: string, pattern: "^[0-9a-f]{24}$" }
        priority: { type: string, enum: [low, normal, high, urgent] }
        due_at: { type: string, format: date-time }
    CRMTask:
      allOf:
        - { $ref: "#/components/schemas/CRMTaskInput" }
        - type: object
          additionalProperties: false
          required: [id, enquiry_id, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            enquiry_id: { type: string, format: uuid }
            status: { type: string, enum: [open, done] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CRMStageHistory:
      type: object
      additionalProperties: false
      required: [id, enquiry_id, actor_id, from, to, created_at]
      properties:
        id: { type: string, format: uuid }
        enquiry_id: { type: string, format: uuid }
        actor_id: { type: string, pattern: "^[0-9a-f]{24}$" }
        from:
          {
            type: string,
            enum:
              [
                "",
                new,
                reviewing,
                qualified,
                call_scheduled,
                proposal_sent,
                negotiation,
                won,
                lost,
                archived,
              ],
          }
        to: { $ref: "#/components/schemas/CRMStage" }
        created_at: { type: string, format: date-time }
    CRMAttachmentInput:
      type: object
      additionalProperties: false
      required: [asset_id, label]
      properties:
        asset_id: { type: string, format: uuid }
        label: { type: string, minLength: 1, maxLength: 200 }
    CRMAttachment:
      allOf:
        - { $ref: "#/components/schemas/CRMAttachmentInput" }
        - type: object
          additionalProperties: false
          required: [id, enquiry_id, added_by, created_at]
          properties:
            id: { type: string, format: uuid }
            enquiry_id: { type: string, format: uuid }
            added_by: { type: string, pattern: "^[0-9a-f]{24}$" }
            created_at: { type: string, format: date-time }
    CRMAttachmentAccess:
      type: object
      additionalProperties: false
      required: [attachment, url, expires_at]
      properties:
        attachment: { $ref: "#/components/schemas/CRMAttachment" }
        url: { type: string, format: uri, pattern: "^https://" }
        expires_at: { type: string, format: date-time }
    CRMNotificationDelivery:
      type: object
      additionalProperties: false
      required:
        [
          id,
          enquiry_id,
          kind,
          status,
          attempts,
          next_attempt_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        enquiry_id: { type: string, format: uuid }
        kind:
          {
            type: string,
            enum: [task.assigned, task.overdue, enquiry.stage_changed],
          }
        status:
          {
            type: string,
            enum: [pending, processing, sent, cancelled, failed, dead_letter],
          }
        attempts: { type: integer, minimum: 0, maximum: 8 }
        next_attempt_at: { type: string, format: date-time }
        last_error_code: { type: string, maxLength: 80 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CRMWorkflow:
      type: object
      additionalProperties: false
      required: [notes, tasks, stage_history, attachments]
      properties:
        notes: { type: array, items: { $ref: "#/components/schemas/CRMNote" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/CRMTask" } }
        stage_history:
          {
            type: array,
            items: { $ref: "#/components/schemas/CRMStageHistory" },
          }
        attachments:
          { type: array, items: { $ref: "#/components/schemas/CRMAttachment" } }
    TicketOrderSelection:
      type: object
      additionalProperties: false
      required: [ticket_type_id, quantity]
      properties:
        ticket_type_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
    CreateTicketOrderRequest:
      type: object
      additionalProperties: false
      required:
        [
          event_id,
          buyer_name,
          buyer_email,
          buyer_phone,
          terms_accepted,
          terms_version,
          items,
        ]
      properties:
        event_id: { type: string, format: uuid }
        buyer_name: { type: string, minLength: 2, maxLength: 160 }
        buyer_email: { type: string, format: email, maxLength: 254 }
        buyer_phone: { type: string, maxLength: 40 }
        terms_accepted: { type: boolean, const: true }
        terms_version: { type: string, const: "2026-08-05" }
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/TicketOrderSelection" }
    TicketOrderReceipt:
      type: object
      additionalProperties: false
      required: [reference, status, currency, total, hold_expires_at]
      properties:
        reference: { type: string, pattern: "^JKT-[0-9]{4}-[A-Z0-9]{8}$" }
        status:
          type: string
          enum:
            [
              pending,
              awaiting_payment,
              paid,
              payment_failed,
              expired,
              cancelled,
              reconciliation_required,
            ]
        currency: { type: string, enum: [GHS, USD, EUR, GBP] }
        total: { type: string, pattern: "^(0|[1-9][0-9]{0,14})\\.[0-9]{2}$" }
        hold_expires_at: { type: string, format: date-time }
    CheckoutSession:
      type: object
      additionalProperties: false
      required: [checkout_url, expires_at]
      properties:
        checkout_url: { type: string, format: uri, pattern: "^https://" }
        expires_at: { type: string, format: date-time }
    IssuedTicket:
      type: object
      additionalProperties: false
      required: [id, ticket_type_id, status, qr_bearer]
      properties:
        id: { type: string, format: uuid }
        ticket_type_id: { type: string, pattern: "^[0-9a-f]{24}$" }
        status: { type: string, enum: [valid, checked_in, void] }
        qr_bearer:
          type: string
          minLength: 80
          maxLength: 256
          description: PII-free signed bearer; clients must not log it.
    TicketConfirmation:
      type: object
      additionalProperties: false
      required:
        [reference, status, buyer_email_masked, access_expires_at, tickets]
      properties:
        reference: { type: string, pattern: "^JKT-[0-9]{4}-[A-Z0-9]{8}$" }
        status: { type: string, const: paid }
        buyer_email_masked: { type: string, maxLength: 254 }
        access_expires_at: { type: string, format: date-time }
        tickets:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/IssuedTicket" }
    TicketDeliveryDeadLetter:
      type: object
      additionalProperties: false
      required:
        [id, order_reference, kind, attempts, error_code, dead_lettered_at]
      properties:
        id: { type: string, format: uuid }
        order_reference: { type: string, pattern: "^JKT-[0-9]{4}-[A-Z0-9]{8}$" }
        kind: { type: string, const: ticket.purchase_confirmation }
        attempts: { type: integer, minimum: 8, maximum: 8 }
        error_code: { type: string, maxLength: 100 }
        dead_lettered_at: { type: string, format: date-time }
    BookingStatus:
      type: string
      enum: [tentative, confirmed, cancelled]
    BookingCreate:
      type: object
      additionalProperties: false
      required:
        [
          enquiry_id,
          title,
          service_id,
          start_at,
          end_at,
          venue,
          city,
          country,
          status,
          fee,
          currency,
          requirements,
        ]
      properties:
        enquiry_id: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 160 }
        service_id: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        venue: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        country: { type: string, pattern: "^[A-Z]{2}$" }
        status: { $ref: "#/components/schemas/BookingStatus" }
        fee: { type: string, pattern: '^(0|[1-9][0-9]{0,14})\.[0-9]{2}$' }
        currency: { type: string, enum: [GHS, USD, EUR, GBP] }
        requirements:
          {
            type: object,
            maxProperties: 30,
            additionalProperties: { type: string, maxLength: 500 },
          }
        version: { type: integer, format: int64, const: 0, default: 0 }
    BookingUpdate:
      type: object
      additionalProperties: false
      required:
        [
          enquiry_id,
          title,
          service_id,
          start_at,
          end_at,
          venue,
          city,
          country,
          status,
          fee,
          currency,
          requirements,
          version,
        ]
      properties:
        enquiry_id: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 160 }
        service_id: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        venue: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        country: { type: string, pattern: "^[A-Z]{2}$" }
        status: { $ref: "#/components/schemas/BookingStatus" }
        fee: { type: string, pattern: '^(0|[1-9][0-9]{0,14})\.[0-9]{2}$' }
        currency: { type: string, enum: [GHS, USD, EUR, GBP] }
        requirements:
          {
            type: object,
            maxProperties: 30,
            additionalProperties: { type: string, maxLength: 500 },
          }
        version: { type: integer, format: int64, minimum: 1 }
    Booking:
      allOf:
        - { $ref: "#/components/schemas/BookingUpdate" }
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    BookingWarning:
      type: object
      additionalProperties: false
      required: [booking_id, title, status, start_at, end_at]
      properties:
        booking_id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
    BookingResult:
      type: object
      additionalProperties: false
      required: [booking, warnings]
      properties:
        booking: { $ref: "#/components/schemas/Booking" }
        warnings:
          {
            type: array,
            items: { $ref: "#/components/schemas/BookingWarning" },
          }
    BookingCalendar:
      type: object
      additionalProperties: false
      required: [items, timezone]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Booking" } }
        timezone: { type: string, minLength: 1, maxLength: 100 }
    CampaignStatus:
      type: string
