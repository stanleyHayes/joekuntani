        [
          generated_at,
          conversion_total,
          booking_submitted,
          ticket_purchases,
          pipeline,
          bookings_by_status,
          campaigns_by_status,
          content_published,
          top_sources,
          top_paths,
          audience,
        ]
      properties:
        generated_at: { type: string, format: date-time }
        conversion_total: { type: integer, minimum: 0 }
        booking_submitted: { type: integer, minimum: 0 }
        ticket_purchases: { type: integer, minimum: 0 }
        pipeline:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        bookings_by_status:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        campaigns_by_status:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        content_published: { type: integer, minimum: 0 }
        top_sources:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsNamedCount" }
        top_paths:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsNamedCount" }
        audience:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsAudienceMetric" }
    AnalyticsTrackInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        properties:
