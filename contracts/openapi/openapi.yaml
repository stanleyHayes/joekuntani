      properties:
        embed_url: { type: string, format: uri, pattern: "^https://" }
        hls_url: { type: string, format: uri, pattern: "^https://" }
        thumbnail_url: { type: string, format: uri, pattern: "^https://" }
    VideoAsset:
      type: object
      additionalProperties: false
      required:
        [
          id,
          slug,
          title,
          description,
          category,
          tags,
          provider,
          thumbnail_url,
          duration_seconds,
          aspect_ratio,
          status,
          visibility,
          is_published,
          sort_order,
          filename,
          mime_type,
          bytes,
          revision,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 5000 }
        category: { type: string, maxLength: 100 }
        tags:
          { type: array, maxItems: 20, items: { type: string, maxLength: 60 } }
        provider: { type: string, enum: [bunny, cloudinary, external] }
        thumbnail_url: { type: string, maxLength: 2048 }
        duration_seconds: { type: integer, minimum: 0 }
        # Measured by the provider once encoding finishes; 0 until then.
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
        # The shape to reserve, always present: the override when one is set,
        # otherwise the measured frame reduced, otherwise 16:9.
        aspect_ratio:
          { type: string, pattern: "^[1-9][0-9]{0,4}:[1-9][0-9]{0,4}$" }
        # The operator's override alone. Empty means "use what was measured".
        aspect_ratio_override:
          { type: string, pattern: "^$|^[1-9][0-9]{0,4}:[1-9][0-9]{0,4}$" }
        status: { $ref: "#/components/schemas/VideoStatus" }
        visibility: { $ref: "#/components/schemas/VideoVisibility" }
        is_published: { type: boolean }
        published_at: { type: string, format: date-time }
        sort_order: { type: integer }
        filename: { type: string }
        mime_type:
          {
            type: string,
            enum: [video/mp4, video/webm, video/quicktime, video/x-matroska],
          }
        bytes: { type: integer, format: int64, minimum: 1 }
        failure_reason: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        playback: { $ref: "#/components/schemas/VideoPlayback" }
